<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testar Verificador</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --tx:#1d2420; --mut:#5d6862; --ac:#0f6e56; --err:#b3261e; --errbg:#fdecea; --okbg:#e6f4ee; --bd:#dcdcd4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141816; --card:#1d2320; --tx:#e8ece9; --mut:#9aa6a0; --ac:#4fc39e; --err:#ff8a80; --errbg:#3a1f1d; --okbg:#173328; --bd:#2f3833; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:28px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--mut); margin:0 0 20px; }
  label { display:block; font-weight:600; margin:14px 0 6px; font-size:13px; }
  input, textarea { width:100%; padding:10px 12px; border:1px solid var(--bd); border-radius:8px; background:var(--card); color:var(--tx); font:inherit; }
  textarea { min-height:240px; resize:vertical; }
  .row { display:flex; gap:16px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  .row label { margin:0; font-weight:400; display:flex; gap:6px; align-items:center; }
  button { background:var(--ac); color:#fff; border:0; border-radius:8px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
  #res { margin-top:20px; padding:16px; border-radius:10px; white-space:pre-line; display:none; }
  #res.err { display:block; background:var(--errbg); border-left:4px solid var(--err); }
  #res.ok { display:block; background:var(--okbg); border-left:4px solid var(--ac); }
</style>
</head>
<body>
<main>
  <h1>Testar o Verificador de Emails</h1>
  <p class="sub">Cole um email real para ver que alerta o Outlook mostraria. Nada é enviado — corre só neste browser.</p>
  <label for="ass">Assunto</label>
  <input id="ass" value="Confirmação da sua viagem a Paris">
  <label for="cor">Corpo do email</label>
  <textarea id="cor">Bom dia,
Confirmamos a reserva dos voos ida e volta Porto-Paris.
Ida: TP438 dia 12/03 às 07h05.
Regresso dia 18/03 às 19:40.
Segue em anexo o itinerário.
Cumprimentos</textarea>
  <div class="row">
    <label><input type="checkbox" id="anx" style="width:auto"> Tem anexo</label>
    <button id="btn">Verificar</button>
  </div>
  <div id="res"></div>
</main>
<script src="launchevent.js"></script>
<script>
  document.getElementById("btn").onclick = function () {
    var p = analisarEmail({
      assunto: document.getElementById("ass").value,
      corpo: document.getElementById("cor").value,
      nAnexos: document.getElementById("anx").checked ? 1 : 0,
      destinatarios: ["cliente@exemplo.pt"]
    });
    var r = document.getElementById("res");
    if (p.length) { r.className = "err"; r.textContent = mensagemAlerta(p, 500); }
    else { r.className = "ok"; r.textContent = "Sem alertas — o email seguiria normalmente."; }
  };
</script>
</body>
</html>
